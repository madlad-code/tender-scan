[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tender-scan"
version = "0.1.0"
description = "Monitor Swedish public procurement notices from TED (Tenders Electronic Daily)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
# Reading what the kommuner send back. The three open-data loaders read CSV and
# JSON and need none of this; a begäran answered by email arrives as whatever
# the kommun's system exports, which so far means xlsx, the old BIFF .xls and
# PDF. Kept optional so the core stays two dependencies.
files = [
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pypdf>=4.0",
]

[project.scripts]
tender-scan = "tender_scan.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Typer's API requires option/argument objects as parameter defaults (B008).
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The repo root on sys.path, so `from tests.x import y` resolves the same way
# under bare `pytest` as under `python -m pytest`. Without it only the latter
# works — it puts the working directory on the path itself — and the test
# suite passes locally while failing in CI, which is how it failed in CI.
pythonpath = ["."]
